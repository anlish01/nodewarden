name: Sync Bitwarden global domains

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      bitwarden_ref:
        description: "bitwarden/server ref to sync"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  sync-global-domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.23.4"

      - name: Sync generated Bitwarden domains
        env:
          BITWARDEN_REF: ${{ inputs.bitwarden_ref || 'main' }}
        run: |
          case "$BITWARDEN_REF" in
            "" | *[!A-Za-z0-9._/-]* )
              echo "Invalid bitwarden_ref"
              exit 1
              ;;
          esac
          npm run domains:sync -- --ref "$BITWARDEN_REF"

      - name: Verify custom domains were not touched
        run: git diff --exit-code -- src/static/global_domains.custom.json

      - name: Commit & push directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/static/global_domains.bitwarden.json \
                  src/static/global_domains.bitwarden.meta.json
          # 上游无变化时不产生空提交，直接绿色结束
          if git diff --cached --quiet; then
            echo "ℹ️ 上游无变化，跳过推送"
            exit 0
          fi
          git commit -m "chore: sync Bitwarden global domain rules"
          git push origin HEAD:main
